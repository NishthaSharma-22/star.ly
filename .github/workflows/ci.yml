name: CI
on:
    pull_request:
    push:
        branches: [main]
jobs:
    check:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgres://test:test@localhost:5432/test
            DATABASE_URL_POOLED: postgres://test:test@localhost:5432/test
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run build